{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            MoodBite
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >
</head>

<body>

    <!-- ======================================================
         NAVBAR
    ======================================================= -->

    <header class="navbar">

        <!-- BRAND -->

        <a
            href="/"
            class="brand"
        >
            <span class="brand-icon">
                🍽️
            </span>

            <span>
                Mood<span>Bite</span>
            </span>
        </a>


        <!-- MOBILE MENU BUTTON -->
        <button
            type="button"
            class="mobile-nav-toggle"
            aria-label="Open navigation menu"
            aria-expanded="false"
            aria-controls="mobileNavigation"
            onclick="toggleMobileNavigation(this)"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>

        <!-- MAIN NAVIGATION -->

        <nav class="nav-links" id="mobileNavigation">

            <a href="/">
                Discover
            </a>

            <a href="/saved/">
                Saved
            </a>
            <a href="/analytics/">
                    Analytics
            </a>
           <a href="{% url 'about' %}">About</a>

        </nav>


        <!-- USER AREA -->

        <div class="nav-user">

            {% if user.is_authenticated %}

                <!-- PROFILE -->

            <a
                    href="{% url 'profile' %}"
                    class="nav-username"
                >
                    👤 {{ user.username }}
            </a>


                <!-- LOGOUT -->

                <form
                    method="post"
                    action="{% url 'logout' %}"
                    class="logout-form"
                >

                    {% csrf_token %}

                    <button
                        type="submit"
                        class="nav-logout"
                    >
                        Logout
                    </button>

                </form>

            {% else %}

                <!-- LOGIN -->

                <a
                    href="{% url 'login' %}"
                    class="nav-login"
                >
                    Login
                </a>


                <!-- REGISTER -->

                <a
                    href="{% url 'register' %}"
                    class="nav-register"
                >
                    Register
                </a>

            {% endif %}

        </div>

    </header>


    <!-- ======================================================
         PAGE CONTENT
    ======================================================= -->

    <main>

        {% block content %}
        {% endblock %}

    </main>


    <!-- ======================================================
         JAVASCRIPT
    ======================================================= -->

    <script src="{% static 'js/app.js' %}"></script>


    <script>
        function toggleMobileNavigation(button) {
            const navbar = button.closest('.navbar');
            const isOpen = navbar.classList.toggle('mobile-menu-open');
            button.setAttribute('aria-expanded', String(isOpen));
            button.setAttribute('aria-label', isOpen ? 'Close navigation menu' : 'Open navigation menu');
        }

        document.addEventListener('click', function (event) {
            const navbar = document.querySelector('.navbar');
            if (!navbar || !navbar.classList.contains('mobile-menu-open')) return;
            if (!navbar.contains(event.target)) {
                navbar.classList.remove('mobile-menu-open');
                const button = navbar.querySelector('.mobile-nav-toggle');
                if (button) {
                    button.setAttribute('aria-expanded', 'false');
                    button.setAttribute('aria-label', 'Open navigation menu');
                }
            }
        });
    </script>

</body>
</html>
